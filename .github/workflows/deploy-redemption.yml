name: Deploy MyDealsPortal redemption (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-REDEMPTION to authorize Firebase production changes'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mydealsportal-production-firebase
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'curiositydrop/mydealsportal' && github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-REDEMPTION'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check that redemption code is present
        run: |
          test -f mydealsportal-backend/redemption.js
          test -f mydealsportal-backend/redemption-policy.js
          grep -q 'match /dealClaims/' firestore.rules
      - name: Install backend dependencies and run checks
        working-directory: mydealsportal-backend
        run: npm install --no-audit --no-fund && npm run check
      - name: Authenticate to Google Cloud using keyless identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/423834035461/locations/global/workloadIdentityPools/mydealsportal-github-deploy/providers/mydealsportal-github
          service_account: mydealsportal-github-deploy@mydealsportal.iam.gserviceaccount.com
      - name: Install Firebase CLI
        run: npm install --no-save --no-audit --no-fund firebase-tools
        working-directory: mydealsportal-backend
      - name: Deploy only new redemption functions and Firestore rules
        env:
          GOOGLE_CLOUD_PROJECT: mydealsportal
        run: |
          ./mydealsportal-backend/node_modules/.bin/firebase deploy --project mydealsportal --non-interactive --force --only firestore:rules,functions:mydealsportal:setRedemptionPin,functions:mydealsportal:issueDealClaim,functions:mydealsportal:getDealClaimStatus,functions:mydealsportal:getBusinessRedemptionSummary,functions:mydealsportal:redeemDealClaim
