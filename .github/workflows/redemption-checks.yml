name: Redemption draft checks
on:
  pull_request:
    paths:
      - 'mydealsportal-backend/redemption-*.js'
      - 'mydealsportal-backend/store-config.js'
      - 'redemption-client.js'
      - 'redemption-api-client.js'
      - 'redemption-ui.js'
      - 'redemption-owner-pin-ui.js'
      - 'redemption-config.js'
      - 'redemption-app-check-client.js'
      - 'deal.html'
      - 'dashboard.html'
      - '.github/workflows/redemption-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mydealsportal-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check redemption-app-check.js && node --check redemption-claim-quota.js && node --check redemption-limits.js && node --check redemption-core.js && node --check redemption-service.js && node --check store-config.js && node --check redemption-http-draft.js && node --check ../redemption-config.js && node --check ../redemption-app-check-client.js && node --check ../redemption-owner-pin-ui.js && node --check ../redemption-ui.js && node --check ../redemption-api-client.js
      - run: node redemption-release-check.js
      - run: node --test redemption-core.test.js redemption-client.test.js redemption-api-client.test.js redemption-limits.test.js redemption-claim-quota.test.js redemption-config.test.js
