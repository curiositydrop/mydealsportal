name: Redemption draft checks
on:
  pull_request:
    paths:
      - 'mydealsportal-backend/redemption-*.js'
      - 'mydealsportal-backend/store-config.js'
      - 'redemption-client.js'
      - '.github/workflows/redemption-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mydealsportal-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check redemption-core.js && node --check redemption-service.js && node --check store-config.js && node --check redemption-http-draft.js
      - run: node --test redemption-core.test.js redemption-client.test.js
