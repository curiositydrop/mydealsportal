name: Outreach pilot (review only)
on:
  pull_request:
    paths:
      - 'automation/**'
      - '.github/workflows/outreach-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate script
        run: python -m py_compile automation/lead_pipeline.py
      - name: Run offline unit tests
        run: python -m unittest discover -s automation/tests -v
