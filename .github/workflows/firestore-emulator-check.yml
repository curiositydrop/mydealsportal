name: Firestore redemption rules emulator
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'mydealsportal-backend/firestore-rules.test.cjs'
      - '.github/workflows/firestore-emulator-check.yml'
  workflow_dispatch:
jobs:
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund firebase-tools @firebase/rules-unit-testing firebase
        working-directory: mydealsportal-backend
      - name: Run Firestore rules tests against local emulator
        run: npx firebase emulators:exec --only firestore --project demo-mydealsportal "node firestore-rules.test.cjs"
        working-directory: mydealsportal-backend
        env:
          CI: 'true'
