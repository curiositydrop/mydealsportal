name: Public SEO renderer tests
on:
  pull_request:
    paths:
      - 'seo/**'
      - '.github/workflows/seo-check.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check seo/render.mjs && node --check seo/preview.mjs && node --check seo/export-firestore.mjs && node --check seo/stage.mjs
      - run: node --test seo/render.test.mjs seo/stage.test.mjs
