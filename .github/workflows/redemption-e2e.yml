name: Redemption end-to-end emulator
on:
  pull_request:
    paths:
      - 'mydealsportal-backend/**'
      - '.github/workflows/redemption-e2e.yml'
      - 'firebase.json'
  workflow_dispatch:
jobs:
  redemption-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund firebase-tools
        working-directory: mydealsportal-backend
      - name: Run claim-to-redemption test in isolated Firebase emulators
        env:
          CI: 'true'
          GCLOUD_PROJECT: demo-mydealsportal
          REDEMPTION_TEST_BASE_URL: http://127.0.0.1:5001/demo-mydealsportal/us-central1/
          REDEMPTION_TEST_DEAL_ID: redemptiontestdeal123
          REDEMPTION_TEST_PIN: '738291'
        run: |
          ./mydealsportal-backend/node_modules/.bin/firebase emulators:exec --project demo-mydealsportal --only firestore,functions "node mydealsportal-backend/redemption-emulator-seed.mjs && node mydealsportal-backend/redemption-smoke.mjs"
